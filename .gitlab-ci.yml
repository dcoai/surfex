# The three checks the sibling projects gate on, plus the goldens and the relation status.
# There is nothing to boot: this package reads source and renders markdown.
variables:
  ELIXIR_IMAGE: hexpm/elixir:1.20.4-erlang-29.0.5-debian-bookworm-20260824-slim

default:
  tags:
    - DCOTek
  interruptible: true

stages:
  - check

.elixir:
  image: $ELIXIR_IMAGE
  variables:
    MIX_ENV: test
  before_script:
    - mix local.hex --force
    - mix local.rebar --force
  cache:
    key:
      files:
        - mix.exs
    paths:
      - _build

format:
  extends: .elixir
  stage: check
  script:
    - mix format --check-formatted

compile:
  extends: .elixir
  stage: check
  script:
    # Warnings are errors for the reason they are in every sibling: an unused alias or an
    # unreachable clause is usually a half-finished edit.
    - mix compile --force --warnings-as-errors

test:
  extends: .elixir
  stage: check
  script:
    # The relation log's tests drive real git (a union merge of two branches' appends is
    # the claim the log rests on), and the slim image has none.
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git > /dev/null
    # This run's evidence only: _build is cached between pipelines, and CI must judge the
    # log's claims by what it sees now.
    - rm -f _build/surfex/evidence.jsonl
    - mix test
    # Every relation in .surfex/ still holds, every public item implements a spec section
    # and every test hint is verified (require: in .surfex.exs), the log verifies, and every
    # confirmation by evidence is borne out by the run above, and every relation was
    # validated by the process (§18): nothing current is merely asserted. It checks; it
    # records nothing.
    - mix surfex.status --verify --evidence --validated

goldens:
  extends: .elixir
  stage: check
  script:
    # Every golden in .surfex.exs: RELATIONS.md, where a stale committed record fails.
    - mix surfex.goldens

docs:
  extends: .elixir
  stage: check
  variables:
    MIX_ENV: dev
  script:
    # What hexdocs.pm will show. ex_doc is surfex's one dependency, dev-only; a reference to
    # a function that doesn't exist fails here rather than on the published docs.
    # This environment's dependencies only: a plain deps.get fetches every environment's,
    # extla (MIX_ENV=model) included, which this image has no git to fetch.
    - mix deps.get --only dev
    - mix docs --warnings-as-errors

model:
  extends: .elixir
  stage: check
  variables:
    # extla is a dependency of this environment only (#128): no other job fetches it.
    MIX_ENV: model
  script:
    - apt-get update -qq && apt-get install -y -qq --no-install-recommends git ca-certificates > /dev/null
    # extla is a private git dependency, fetched with this job's CI_JOB_TOKEN: per-job and
    # ephemeral. That needs dco-tek/surfex on dco-tek/extla's job-token allowlist, which is
    # per-project and not inherited from the group: "HTTP Basic: Access denied" means check
    # it. `--add` on the second line is load-bearing: insteadOf is multi-valued, and plain
    # `git config` replaces the first value rather than adding one (extla 7e16bd3).
    - git config --global url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "https://${CI_SERVER_HOST}/"
    - git config --global --add url."https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/".insteadOf "git@${CI_SERVER_HOST}:"
    - mix deps.get --only model
    # Every invariant in every state the bounded model reaches (spec §22).
    - mix test test/surfex/relation_log_model_test.exs
